name: Mantener activa Base de Datos Supabase

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (07:00 AM hora Colombia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping-keep-alive:
    name: Ping Health Check & Keep-Alive
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Ping de Reactivación
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e '
            const https = require("https");

            function pingUrl(url) {
              return new Promise((resolve) => {
                console.log("Realizando ping a:", url);
                https.get(url, (res) => {
                  console.log("Código de respuesta:", res.statusCode);
                  resolve(res.statusCode);
                }).on("error", (err) => {
                  console.log("Aviso de conexión:", err.message);
                  resolve(null);
                });
              });
            }

            async function run() {
              // 1. Ping al endpoint /api/health
              let status = await pingUrl("https://creditos-gilt.vercel.app/api/health");
              
              // 2. Ping a la URL principal
              await pingUrl("https://creditos-gilt.vercel.app/");

              // 3. Si tienes configurada DATABASE_URL en GitHub Secrets, consulta directa a Supabase
              if (process.env.DATABASE_URL) {
                console.log("Ejecutando consulta directa a Supabase (PostgreSQL)...");
                try {
                  const { Client } = require("pg");
                  const client = new Client({
                    connectionString: process.env.DATABASE_URL,
                    ssl: { rejectUnauthorized: false }
                  });
                  await client.connect();
                  const res = await client.query("SELECT NOW() as db_time;");
                  console.log("✅ Supabase activo y respondiendo:", res.rows[0].db_time);
                  await client.end();
                } catch (e) {
                  console.log("Aviso en consulta directa:", e.message);
                }
              }

              console.log("✅ Proceso completado exitosamente.");
            }

            run();
          '
